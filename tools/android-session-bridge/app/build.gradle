plugins {
    id 'com.android.application'
}

android {
    namespace 'com.yackov.androidsessionbridge'
    compileSdk 35

    defaultConfig {
        applicationId 'com.yackov.androidsessionbridge'
        minSdk 30
        targetSdk 35
        versionCode 21
        versionName '1.0.9'
    }

    signingConfigs {
        release {
            def ks = System.getenv("ASB_KEYSTORE")
            if (ks != null && !ks.isBlank()) {
                storeFile file(ks)
                storePassword System.getenv("ASB_STORE_PASSWORD")
                keyAlias System.getenv("ASB_KEY_ALIAS")
                keyPassword System.getenv("ASB_KEY_PASSWORD")
                enableV1Signing true
                enableV2Signing true
                enableV3Signing true
            }
        }
    }

    buildTypes {
        debug {
            applicationIdSuffix ".debug"
            versionNameSuffix "-debug"
        }
        release {
            minifyEnabled false
            def ks = System.getenv("ASB_KEYSTORE")
            if (ks != null && !ks.isBlank()) {
                signingConfig signingConfigs.release
            }
        }
    }
}

dependencies {
}
