<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-label="Phone media recovery case classification">
  <rect width="1200" height="720" fill="#ffffff"/>
  <text x="70" y="72" font-family="Segoe UI, Arial" font-size="34" font-weight="700" fill="#111827">Classify before copying</text>
  <text x="70" y="112" font-family="Segoe UI, Arial" font-size="18" fill="#4b5563">The same symptom in the app can have different filesystem causes.</text>
  <g font-family="Segoe UI, Arial" font-size="18">
    <rect x="70" y="170" width="315" height="390" rx="18" fill="#ecfeff" stroke="#0891b2" stroke-width="3"/>
    <text x="228" y="222" text-anchor="middle" font-size="26" font-weight="700" fill="#164e63">Missing</text>
    <text x="105" y="280" fill="#164e63">Source has exact path.</text>
    <text x="105" y="316" fill="#164e63">Destination lacks it.</text>
    <text x="105" y="382" fill="#0f172a" font-weight="700">Action</text>
    <text x="105" y="420" fill="#164e63">Restore exact path, timestamp,</text>
    <text x="105" y="452" fill="#164e63">then verify size and checksum.</text>

    <rect x="443" y="170" width="315" height="390" rx="18" fill="#fff7ed" stroke="#f97316" stroke-width="3"/>
    <text x="600" y="222" text-anchor="middle" font-size="26" font-weight="700" fill="#7c2d12">Partial</text>
    <text x="478" y="280" fill="#7c2d12">Same path exists on both sides.</text>
    <text x="478" y="316" fill="#7c2d12">Size or checksum differs.</text>
    <text x="478" y="382" fill="#0f172a" font-weight="700">Action</text>
    <text x="478" y="420" fill="#7c2d12">Replace only after approval</text>
    <text x="478" y="452" fill="#7c2d12">and source verification.</text>

    <rect x="815" y="170" width="315" height="390" rx="18" fill="#f1f5f9" stroke="#64748b" stroke-width="3"/>
    <text x="973" y="222" text-anchor="middle" font-size="26" font-weight="700" fill="#334155">Cloud-only</text>
    <text x="850" y="280" fill="#334155">Source also lacks the file.</text>
    <text x="850" y="316" fill="#334155">App shows download state.</text>
    <text x="850" y="382" fill="#0f172a" font-weight="700">Action</text>
    <text x="850" y="420" fill="#334155">Use app or cloud download.</text>
    <text x="850" y="452" fill="#334155">Local copy cannot recreate it.</text>
  </g>
  <text x="600" y="638" font-family="Segoe UI, Arial" font-size="20" font-weight="700" text-anchor="middle" fill="#0f766e">Do not infer from date, preview, display name, or approximate size.</text>
</svg>
