name: Android Session Bridge APK

on:
  push:
    branches: [ main ]
    paths:
      - 'tools/android-session-bridge/**'
      - '.github/workflows/android-session-bridge.yml'
      - '!tools/android-session-bridge/dist/**'
  pull_request:
    branches: [ main ]
    paths:
      - 'tools/android-session-bridge/**'
      - '.github/workflows/android-session-bridge.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare Android SDK
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build and publish APK/status into repository
        shell: bash
        run: |
          set +e
          cd tools/android-session-bridge
          mkdir -p dist
          rm -f dist/android-session-bridge-debug.apk dist/build.log dist/build-status.json
          gradle --no-daemon :app:assembleDebug > >(tee dist/build.log) 2>&1
          BUILD_EXIT=$?
          if [ "$BUILD_EXIT" -eq 0 ]; then
            cp app/build/outputs/apk/debug/app-debug.apk dist/android-session-bridge-debug.apk
            STATUS="success"
          else
            STATUS="failure"
          fi
          printf '{"status":"%s","commit":"%s","run_id":"%s","built_at":"%s"}\n' \
            "$STATUS" "$GITHUB_SHA" "$GITHUB_RUN_ID" "$(date -u +%FT%TZ)" > dist/build-status.json
          cd ../..
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/android-session-bridge/dist
          git commit -m "android bridge: publish APK build [skip ci]" || true
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            git push origin HEAD:main
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-session-bridge-build
          path: |
            tools/android-session-bridge/dist/build-status.json
            tools/android-session-bridge/dist/build.log
            tools/android-session-bridge/dist/android-session-bridge-debug.apk
          if-no-files-found: warn
          retention-days: 14

      - name: Fail workflow when APK build failed
        if: always()
        shell: bash
        run: |
          test -f tools/android-session-bridge/dist/android-session-bridge-debug.apk
